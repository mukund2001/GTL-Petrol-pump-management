# Spring Boot Application Name
spring.application.name=demo

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/petrol_pump_system?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=Mukund@2001

# Hibernate (JPA) Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# To always execute init SQL (if necessary)
spring.sql.init.mode=always
spring.resources.static-locations=classpath:/static/

# File upload configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
spring.jackson.stream-write-constraints.max-nesting-depth=2000


