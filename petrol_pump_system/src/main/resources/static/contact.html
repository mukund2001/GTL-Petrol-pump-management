<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - GTL Petrol Pump</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
        body {
            background: linear-gradient(to bottom, #f7f9fc, #e9ecef);
            color: #212529;
            font-family: 'Poppins', sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            margin: 0;
            padding: 0;
        }

        .navbar {
            background: #1d3557;
            padding: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .navbar-brand {
            font-size: 28px;
            font-weight: bold;
            color: #f1faee;
        }

        .navbar-nav .nav-link {
            color: #f1faee;
            font-weight: 500;
            margin-left: 15px;
            transition: color 0.3s ease;
        }

        .navbar-nav .nav-link:hover {
            color: #a8dadc;
        }

        h1 {
            font-size: 36px;
            font-weight: bold;
            color: #1d3557;
            margin: 50px 0 20px;
            text-align: center;
        }

        .contact-info {
            background: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
            margin: 0 auto;
            max-width: 600px;
            text-align: center;
        }

        .contact-info p {
            font-size: 18px;
            margin: 15px 0;
        }

        .contact-info strong {
            color: #1d3557;
        }

        .btn-return-home {
            background: linear-gradient(45deg, #ff6f61, #ff9671);
            color: white;
            font-size: 18px;
            padding: 12px 25px;
            border-radius: 30px;
            display: inline-block;
            text-align: center;
            font-weight: bold;
            text-decoration: none;
            transition: background 0.4s ease, transform 0.3s ease;
            margin-top: 20px;
        }

        .btn-return-home:hover {
            background: linear-gradient(45deg, #ff9671, #ff6f61);
            transform: translateY(-5px);
        }

        footer {
            background: #1d3557;
            color: #f1faee;
            text-align: center;
            padding: 12px;
            font-size: 14px;
            position: fixed;
            width: 100%;
            bottom: 0;
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">GTL Petrol Pump</a>
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="/login.html">Login</a></li>
               
            </ul>
        </div>
    </nav>

    <!-- Contact Us Section -->
    <div class="container">
        <h1>Contact Us</h1>
        <div class="contact-info">
            <p><strong>Address:</strong> GTL Petrol Pump, Karve Nagar, Pune, India</p>
            <p><strong>Phone:</strong> 9307532876</p>
            <p><strong>Email:</strong> contact@gtlpetrolpump.com</p>
        </div>

        <!-- Return Home Button -->
        <a href="/" class="btn-return-home">Return Home</a>
    </div>

    <!-- Footer -->
    <footer>
        <p>&copy; 2024 GTL Petrol Pump | All Rights Reserved</p>
    </footer>

</body>

</html>
