<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Attendee Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(to bottom, #f7f9fc, #e9ecef);
            color: #212529;
            font-family: 'Poppins', sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            margin: 0;
            padding: 0;
        }

        .navbar {
            background: #1d3557;
            padding: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .navbar-brand {
            font-size: 28px;
            font-weight: bold;
            color: #f1faee;
        }

        .navbar-nav .nav-link {
            color: #f1faee;
            font-weight: 500;
            margin-left: 15px;
            transition: color 0.3s ease;
        }

        .navbar-nav .nav-link:hover {
            color: #a8dadc;
        }

        h1 {
            font-size: 36px;
            font-weight: bold;
            color: #1d3557;
            margin: 50px 0 20px;
            text-align: center;
        }

        .table-container {
            margin-top: 20px;
        }

        .form-container {
            margin-top: 40px;
            padding: 20px;
            background: #ffffff;
            border-radius: 10px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
        }

        .btn-actions {
            display: flex;
            justify-content: space-around;
        }

        .btn-return-home {
            background: linear-gradient(45deg, #ff6f61, #ff9671);
            color: white;
            font-size: 18px;
            padding: 12px 25px;
            border-radius: 30px;
            display: inline-block;
            text-align: center;
            font-weight: bold;
            text-decoration: none;
            transition: background 0.4s ease, transform 0.3s ease;
            margin-top: 20px;
        }

        .btn-return-home:hover {
            background: linear-gradient(45deg, #ff9671, #ff6f61);
            transform: translateY(-5px);
        }

        footer {
            background: #1d3557;
            color: #f1faee;
            text-align: center;
            padding: 12px;
            font-size: 14px;
            position: fixed;
            width: 100%;
            bottom: 0;
        }

        .btn-primary, .btn-danger, .btn-success {
            font-weight: bold;
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">GTL Petrol Pump</a>
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="/customerCredits.html">CustomerCredits</a></li>
                <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="/login.html">Login</a></li>
            </ul>
        </div>
    </nav>

    <!-- Customer Attendee Management Section -->
    <div class="container">
        <h1>Customer Attendee Management</h1>

        <div class="table-container">
            <table class="table table-striped">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Nozzle Assigned</th>
                        <th>Shift Active</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="customer-attendee-table">
                    <!-- Data will be dynamically populated -->
                </tbody>
            </table>
        </div>

        <div class="form-container">
            <h3 class="text-center">Add / Update Attendee</h3>
            <form id="attendee-form">
                <div class="mb-3">
                    <label for="id" class="form-label">ID (Leave empty for new)</label>
                    <input type="text" class="form-control" id="id" readonly>
                </div>
                <div class="mb-3">
                    <label for="name" class="form-label">Name</label>
                    <input type="text" class="form-control" id="name" required>
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" required>
                </div>
                <div class="mb-3">
                    <label for="phone" class="form-label">Phone</label>
                    <input type="text" class="form-control" id="phone" required>
                </div>
                <div class="mb-3">
                    <label for="nozzleAssigned" class="form-label">Nozzle Assigned</label>
                    <input type="text" class="form-control" id="nozzleAssigned">
                </div>
                <div class="mb-3">
                    <label for="shiftActive" class="form-label">Shift Active</label>
                    <select class="form-select" id="shiftActive">
                        <option value="true">Yes</option>
                        <option value="false">No</option>
                    </select>
                </div>
                <div class="btn-actions">
                    <button type="submit" class="btn btn-success">Save</button>
                    <button type="button" id="reset" class="btn btn-secondary">Reset</button>
                </div>
            </form>
        </div>

        <a href="/" class="btn-return-home">Return Home</a>
    </div>

    <!-- Footer -->
    <footer>
        <p>&copy; 2025 GTL Petrol Pump | All Rights Reserved</p>
    </footer>

    <script>
        async function fetchCustomerAttendees() {
            try {
                const response = await fetch('/customer-attendees');
                const data = await response.json();

                const tableBody = document.getElementById('customer-attendee-table');
                tableBody.innerHTML = '';

                data.forEach(attendee => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${attendee.id}</td>
                        <td>${attendee.name}</td>
                        <td>${attendee.email}</td>
                        <td>${attendee.phone}</td>
                        <td>${attendee.nozzleAssigned}</td>
                        <td>${attendee.shiftActive ? 'Yes' : 'No'}</td>
                        <td>
                            <button class="btn btn-primary btn-sm" onclick="editAttendee(${JSON.stringify(attendee).replace(/"/g, '&quot;')})">Edit</button>
                            <button class="btn btn-danger btn-sm" onclick="deleteAttendee(${attendee.id})">Delete</button>
                        </td>
                    `;
                    tableBody.appendChild(row);
                });
            } catch (error) {
                console.error('Error fetching attendees:', error);
            }
        }

        function editAttendee(attendee) {
            document.getElementById('id').value = attendee.id || '';
            document.getElementById('name').value = attendee.name || '';
            document.getElementById('email').value = attendee.email || '';
            document.getElementById('phone').value = attendee.phone || '';
            document.getElementById('nozzleAssigned').value = attendee.nozzleAssigned || '';
            document.getElementById('shiftActive').value = attendee.shiftActive ? 'true' : 'false';
        }

        async function deleteAttendee(id) {
            if (!confirm('Are you sure you want to delete this attendee?')) return;

            try {
                await fetch(`/customer-attendees/${id}`, { method: 'DELETE' });
                fetchCustomerAttendees();
            } catch (error) {
                console.error('Error deleting attendee:', error);
            }
        }

        document.getElementById('attendee-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('id').value;
            const attendee = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value,
                nozzleAssigned: document.getElementById('nozzleAssigned').value,
                shiftActive: document.getElementById('shiftActive').value === 'true'
            };

            try {
                const method = id ? 'PUT' : 'POST';
                const url = id ? `/customer-attendees/${id}` : '/customer-attendees';
                await fetch(url, {
                    method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(attendee)
                });
                fetchCustomerAttendees();
                document.getElementById('attendee-form').reset();
            } catch (error) {
                console.error('Error saving attendee:', error);
            }
        });

        document.getElementById('reset').addEventListener('click', () => {
            document.getElementById('attendee-form').reset();
        });

        window.onload = fetchCustomerAttendees;
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
