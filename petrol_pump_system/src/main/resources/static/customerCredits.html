<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Credit Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(to bottom, #f7f9fc, #e9ecef);
            color: #212529;
            font-family: 'Poppins', sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .navbar {
            background: #1d3557;
            padding: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .navbar-brand {
            font-size: 28px;
            font-weight: bold;
            color: #f1faee;
        }

        .navbar .navbar-nav .nav-link {
            color: #f1faee;
        }

        .navbar .navbar-nav .nav-link:hover {
            color: #457b9d;
        }

        h1 {
            font-size: 36px;
            font-weight: bold;
            color: #1d3557;
            text-align: center;
            margin: 30px 0;
        }

        .table-container {
            background: #ffffff;
            border-radius: 10px;
            padding: 25px;
            margin: 20px auto;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
        }

        .btn {
            background: #457b9d;
            color: #ffffff;
            font-weight: bold;
            padding: 10px 20px;
            border: none;
            border-radius: 25px;
            transition: transform 0.2s ease, box-shadow 0.3s ease;
        }

        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(69, 123, 157, 0.3);
        }

        footer {
            background: #1d3557;
            color: #f1faee;
            text-align: center;
            padding: 10px 0;
            margin-top: auto;
        }

        .search-box {
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .search-box input {
            width: 300px;
            padding: 8px;
            font-size: 16px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        .search-box button {
            padding: 8px 15px;
            background-color: #457b9d;
            color: white;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-left: 10px;
        }

        .search-box button:hover {
            background-color: #1d3557;
        }
    </style>
</head>

<body>
     <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">GTL Petrol Pump</a>
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="/login.html">Login</a></li>
               
            </ul>
        </div>
    </nav>

    <div class="container">
        <h1>Customer Credit Management</h1>

        <!-- Search Box Section -->
        <div class="search-box">
            <input type="text" id="searchQuery" placeholder="Search by Name or Mobile Number">
            <button onclick="searchCustomerCredit()">Search</button>
        </div>

        <!-- Table Section -->
        <div class="table-container">
            <h3 class="text-center">Customer Credits</h3>
            <table class="table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Mobile No</th>
                        <th>Balance Amount</th>
                        <th>Paid Amount</th>
                        <th>Email</th>
                        <th>Transaction Date</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="customer-credit-table">
                    <!-- Data dynamically inserted here -->
                </tbody>
            </table>
        </div>

        <!-- Form Section -->
        <div class="table-container">
            <h3 class="text-center">Add / Update Customer Credit</h3>
            <form id="credit-form">
                <div class="mb-3">
                    <label for="id" class="form-label">ID (Leave empty for new)</label>
                    <input type="text" class="form-control" id="id" readonly>
                </div>
                <div class="mb-3">
                    <label for="name" class="form-label">Name</label>
                    <input type="text" class="form-control" id="name" required>
                </div>
                <div class="mb-3">
                    <label for="moNo" class="form-label">Mobile No</label>
                    <input type="text" class="form-control" id="moNo" required>
                </div>
                <div class="mb-3">
                    <label for="balanceAmt" class="form-label">Balance Amount</label>
                    <input type="number" class="form-control" id="balanceAmt" required>
                </div>
                <div class="mb-3">
                    <label for="paidAmt" class="form-label">Paid Amount</label>
                    <input type="number" class="form-control" id="paidAmt" required>
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" required>
                </div>
                <div class="mb-3">
                    <label for="transactionDatetime" class="form-label">Transaction Date</label>
                    <input type="datetime-local" class="form-control" id="transactionDatetime" required>
                </div>
                <button type="submit" class="btn">Save</button>
            </form>
        </div>
    </div>

    <footer>
        <p>&copy; 2024 GTL Petrol Pump | All Rights Reserved</p>
    </footer>

    <script>
        // Function to fetch customer records
        async function fetchCustomerCredits(query = '') {
            try {
                const response = await fetch(`/customer-credit?search=${query}`);
                const data = await response.json();

                const tableBody = document.getElementById('customer-credit-table');
                tableBody.innerHTML = '';

                // Display all records if no data
                if (data.length === 0) {
                    tableBody.innerHTML = '<tr><td colspan="8" class="text-center">No records found</td></tr>';
                }

                data.forEach(credit => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${credit.id}</td>
                        <td>${credit.name}</td>
                        <td>${credit.moNo}</td>
                        <td>${credit.balanceAmt.toFixed(2)}</td>
                        <td>${credit.paidAmt.toFixed(2)}</td>
                        <td>${credit.email}</td>
                        <td>${new Date(credit.transactionDatetime).toLocaleString()}</td>
                        <td>
                            <button class="btn btn-sm btn-primary" onclick="editCustomerCredit(${credit.id})">Edit</button>
                            <button class="btn btn-sm btn-danger" onclick="deleteCustomerCredit(${credit.id})">Delete</button>
                        </td>
                    `;
                    tableBody.appendChild(row);
                });
            } catch (error) {
                console.error('Error fetching customer credit data:', error);
            }
        }

        // Function to save a new or updated customer credit record
        async function saveCustomerCredit(event) {
            event.preventDefault();

            const id = document.getElementById('id').value;
            const name = document.getElementById('name').value;
            const moNo = document.getElementById('moNo').value;
            const balanceAmt = document.getElementById('balanceAmt').value;
            const paidAmt = document.getElementById('paidAmt').value;
            const email = document.getElementById('email').value;
            const transactionDatetime = document.getElementById('transactionDatetime').value;

            const payload = { name, moNo, balanceAmt, paidAmt, email, transactionDatetime };
            const method = id ? 'PUT' : 'POST';
            const url = id ? `/customer-credit/${id}` : '/customer-credit';

            try {
                await fetch(url, {
                    method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                document.getElementById('credit-form').reset();
                fetchCustomerCredits();
            } catch (error) {
                console.error('Error saving customer credit:', error);
            }
        }

        // Function to edit customer credit
        async function editCustomerCredit(id) {
            try {
                const response = await fetch(`/customer-credit/${id}`);
                const credit = await response.json();

                document.getElementById('id').value = credit.id;
                document.getElementById('name').value = credit.name;
                document.getElementById('moNo').value = credit.moNo;
                document.getElementById('balanceAmt').value = credit.balanceAmt;
                document.getElementById('paidAmt').value = credit.paidAmt;
                document.getElementById('email').value = credit.email;
                document.getElementById('transactionDatetime').value = new Date(credit.transactionDatetime).toISOString().slice(0, 16);
            } catch (error) {
                console.error('Error editing customer credit:', error);
            }
        }

        // Function to delete customer credit
        async function deleteCustomerCredit(id) {
            try {
                await fetch(`/customer-credit/${id}`, { method: 'DELETE' });
                fetchCustomerCredits();
            } catch (error) {
                console.error('Error deleting customer credit:', error);
            }
        }

        // Function to search customer credits
        function searchCustomerCredit() {
            const query = document.getElementById('searchQuery').value;
            fetchCustomerCredits(query);
        }

        // Initialize page
        document.addEventListener('DOMContentLoaded', function () {
            fetchCustomerCredits();
            document.getElementById('credit-form').addEventListener('submit', saveCustomerCredit);
        });
    </script>
</body>

</html>
