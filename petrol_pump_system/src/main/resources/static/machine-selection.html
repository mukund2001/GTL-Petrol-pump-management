<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Start Shift - GTL Petrol Pump</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
        body {
            font-family: Arial, sans-serif;
        }

        .navbar {
            background-color: #007bff;
        }

        .navbar-brand {
            color: white !important;
        }

        .form-container {
            padding: 40px;
            max-width: 800px;
            margin: 20px auto;
            background-color: #f8f9fa;
            border-radius: 8px;
            box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.1);
        }

        footer {
            text-align: center;
            margin-top: 30px;
            color: #6c757d;
        }

        h2 {
            font-size: 24px;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-control {
            border-radius: 8px;
        }

        .btn-primary {
            background-color: #007bff;
            border-color: #007bff;
            border-radius: 8px;
        }

        .btn-primary:hover {
            background-color: #0056b3;
            border-color: #0056b3;
        }

        .checkbox-group label {
            margin-right: 15px;
        }

        .checkbox-group input[type="checkbox"] {
            margin-right: 8px;
        }

        .dropdown-menu {
            max-height: 300px;
            overflow-y: auto;
        }

        .form-check {
            margin-bottom: 10px;
        }

        .nozzle-input-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nozzle-input-group input {
            flex: 1;
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">GTL Petrol Pump</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="/contact.html">Contact Us</a></li>
                    <li class="nav-item"><a class="nav-link" href="/login.html">Login</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Shift Start Form -->
    <div class="form-container">
        <h2>Machine, Nozzle, and Price Selection</h2>
        <form action="/start_shift.html" method="get">

            <div class="form-group">
                <label for="attendeeName">Attendee Name</label>
                <input type="text" id="attendeeName" name="attendeeName" class="form-control" placeholder="Your Name" required>
            </div>

            <!-- Machine Selection (Checkboxes for Multiple Machines) -->
            <div class="form-group">
                <label>Select Machines</label><br>
                <div class="checkbox-group">
                    <input type="checkbox" id="machine1" name="machineSelected[]" value="Machine 1">
                    <label for="machine1">Machine 1</label>
                    <input type="checkbox" id="machine2" name="machineSelected[]" value="Machine 2">
                    <label for="machine2">Machine 2</label>
                    <input type="checkbox" id="machine3" name="machineSelected[]" value="Machine 3">
                    <label for="machine3">Machine 3</label>
                    <input type="checkbox" id="machine4" name="machineSelected[]" value="Machine 4">
                    <label for="machine4">Machine 4</label>
                </div>
            </div>

            <!-- Nozzle Selection (Dynamically Generated) -->
            <div class="form-group" id="nozzleGroup" style="display:none;">
                <label>Select Nozzles</label>
                <div id="nozzleOptions"></div>
            </div>

            <div class="form-group">
                <label for="pricePetrol">Price per Liter (Petrol)</label>
                <input type="number" step="0.01" id="pricePetrol" name="pricePerLiterPetrol" class="form-control" placeholder="Enter Price" required>
            </div>

            <div class="form-group">
                <label for="priceDiesel">Price per Liter (Diesel)</label>
                <input type="number" step="0.01" id="priceDiesel" name="pricePerLiterDiesel" class="form-control" placeholder="Enter Price" required>
            </div>

            <button type="submit" class="btn btn-primary">Start Shift</button>
        </form>
    </div>

    <footer>
        <p>&copy; 2025 GTL Petrol Pump | All Rights Reserved</p>
    </footer>

    <!-- Script for Dynamic Nozzle Dropdown -->
    <script>
        document.querySelectorAll('input[name="machineSelected[]"]').forEach(function (checkbox) {
            checkbox.addEventListener("change", function () {
                const selectedMachines = Array.from(document.querySelectorAll('input[name="machineSelected[]"]:checked')).map(input => input.value);
                const nozzleGroup = document.getElementById("nozzleGroup");
                const nozzleOptions = document.getElementById("nozzleOptions");

                // Clear previous nozzle options
                nozzleOptions.innerHTML = "";

                // Only show the nozzle selection if at least one machine is selected
                if (selectedMachines.length > 0) {
                    nozzleGroup.style.display = "block";

                    let nozzleCount = 0;

                    // Loop through selected machines
                    selectedMachines.forEach((machine, machineIndex) => {
                        for (let nozzleIndex = 1; nozzleIndex <= 4; nozzleIndex++) {
                            nozzleCount++;
                            const nozzleName = `M${machineIndex + 1}N${nozzleIndex}`;

                            const div = document.createElement("div");
                            div.classList.add("form-check", "nozzle-input-group");

                            const checkbox = document.createElement("input");
                            checkbox.type = "checkbox";
                            checkbox.id = nozzleName;
                            checkbox.name = "nozzlesSelected[]";
                            checkbox.value = nozzleName;

                            const label = document.createElement("label");
                            label.setAttribute("for", nozzleName);
                            label.innerText = nozzleName;

                            const currentReadingInput = document.createElement("input");
                            currentReadingInput.type = "number";
                            currentReadingInput.step = "0.01";
                            currentReadingInput.name = `nozzleReading[${nozzleName}]`;
                            currentReadingInput.classList.add("form-control");
                            currentReadingInput.placeholder = "Start Reading";

                            const testingFuelInput = document.createElement("input");
                            testingFuelInput.type = "number";
                            testingFuelInput.step = "0.01";
                            testingFuelInput.name = `testingFuel[${nozzleName}]`;
                            testingFuelInput.classList.add("form-control");
                            testingFuelInput.placeholder = "Testing Fuel";

                            div.appendChild(checkbox);
                            div.appendChild(label);
                            div.appendChild(currentReadingInput);
                            div.appendChild(testingFuelInput);

                            nozzleOptions.appendChild(div);
                        }
                    });
                } else {
                    nozzleGroup.style.display = "none";
                }
            });
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
