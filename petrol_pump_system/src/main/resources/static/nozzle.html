<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nozzles - GTL Petrol Pump</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(to bottom, #f7f9fc, #e9ecef);
            font-family: 'Poppins', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .navbar {
            background: #1d3557;
            padding: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            width: 100%;
        }

        .navbar-brand {
            font-size: 28px;
            font-weight: bold;
            color: #f1faee;
        }

        .navbar-nav .nav-link {
            color: #f1faee;
            margin-left: 15px;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .navbar-nav .nav-link:hover {
            color: #a8dadc;
        }

        .nozzles-container {
            background: #ffffff;
            border-radius: 10px;
            padding: 40px;
            margin-top: 80px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 900px;
        }

        .nozzles-container h2 {
            font-size: 32px;
            font-weight: bold;
            color: #1d3557;
            text-align: center;
            margin-bottom: 30px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background-color: #457b9d;
            color: white;
            padding: 10px;
            text-align: left;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
        }

        tr:hover {
            background-color: #f5f5f5;
        }

        footer {
            background: #1d3557;
            color: #f1faee;
            text-align: center;
            padding: 10px 0;
            width: 100%;
            position: fixed;
            bottom: 0;
        }

        footer p {
            margin: 0;
            font-size: 14px;
        }
    </style>
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">GTL Petrol Pump</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="/contact.html">Contact Us</a></li>
                    <li class="nav-item"><a class="nav-link" href="/login.html">Login</a></li>
                    <li class="nav-item"><a class="nav-link" href="/machines.html">Machines</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Nozzles Container -->
    <div class="nozzles-container">
        <h2>Nozzles for Machine</h2>

        <table id="nozzlesTable">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Fuel Dispensed</th>
                    <th>Start Reading</th>
                    <th>End Reading</th>
                    <th>Total Price</th>
                    <th>Description</th>
                </tr>
            </thead>
            <tbody>
                <!-- Dynamic rows will be inserted here using JavaScript -->
            </tbody>
        </table>
    </div>

    <!-- Footer -->
    <footer>
        <p>&copy; 2025 GTL Petrol Pump | All Rights Reserved</p>
    </footer>

    <!-- Include Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // Get machine ID from URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const machineId = urlParams.get('machineId');

        fetch(`/nozzles/machine/${machineId}`)
            .then(response => response.json())
            .then(nozzles => {
                const tableBody = document.querySelector('#nozzlesTable tbody');
                nozzles.forEach(nozzle => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${nozzle.id}</td>
                        <td>${nozzle.fuel_dispensed}</td>
                        <td>${nozzle.start_reading}</td>
                        <td>${nozzle.end_reading}</td>
                        <td>${nozzle.total_price}</td>
                        <td>${nozzle.description}</td>
                    `;
                    tableBody.appendChild(row);
                });
            })
            .catch(error => console.error('Error fetching nozzles:', error));
    </script>
</body>

</html>
