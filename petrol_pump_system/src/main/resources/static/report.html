<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports - GTL Petrol Pump</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(to bottom, #f7f9fc, #e9ecef);
            font-family: 'Poppins', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .navbar {
            background: #1d3557;
            padding: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            width: 100%;
        }

        .navbar-brand {
            font-size: 28px;
            font-weight: bold;
            color: #f1faee;
        }

        .navbar-nav .nav-link {
            color: #f1faee;
            margin-left: 15px;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .navbar-nav .nav-link:hover {
            color: #a8dadc;
        }

        .reports-container {
            background: #ffffff;
            border-radius: 10px;
            padding: 40px;
            margin-top: 80px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 900px;
        }

        .reports-container h2 {
            font-size: 32px;
            font-weight: bold;
            color: #1d3557;
            text-align: center;
            margin-bottom: 30px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background-color: #457b9d;
            color: white;
            padding: 10px;
            text-align: left;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
        }

        tr:hover {
            background-color: #f5f5f5;
        }

        .btn-primary {
            background: #457b9d;
            border: none;
            color: white;
            padding: 14px;
            font-size: 18px;
            width: 100%;
            border-radius: 30px;
            cursor: pointer;
            transition: background 0.4s ease, transform 0.3s ease;
        }

        .btn-primary:hover {
            background: #1d3557;
            transform: translateY(-5px);
        }

        footer {
            background: #1d3557;
            color: #f1faee;
            text-align: center;
            padding: 10px 0;
            width: 100%;
            position: fixed;
            bottom: 0;
        }

        footer p {
            margin: 0;
            font-size: 14px;
        }
    </style>
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">GTL Petrol Pump</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="/contact.html">Contact Us</a></li>
                    <li class="nav-item"><a class="nav-link" href="/login.html">Login</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Reports Container -->
    <div class="reports-container">
        <h2>Petrol Pump Reports</h2>

        <table id="reportsTable">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Date</th>
                    <th>Total Fuel Dispensed (Liters)</th>
                    <th>Total Amount Earned (₹)</th>
                    <th>Total Fuel Consumed for Testing (Liters)</th>
                </tr>
            </thead>
            <tbody>
                <!-- Dynamic rows will be inserted here using JavaScript -->
            </tbody>
        </table>

        <button class="btn-primary" onclick="window.location.reload();">Reload Reports</button>
    </div>

    <!-- Footer -->
    <footer>
        <p>&copy; 2025 GTL Petrol Pump | All Rights Reserved</p>
    </footer>

    <!-- Include Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // Fetch all reports from the API and display them in the table
        fetch('/reports/all')
            .then(response => response.json())
            .then(reports => {
                const tableBody = document.querySelector('#reportsTable tbody');
                reports.forEach(report => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${report.id}</td>
                        <td>${report.date}</td>
                        <td>${report.totalFuelDispensed}</td>
                        <td>${report.totalAmountEarned}</td>
                        <td>${report.totalFuelConsumedForTesting}</td>
                    `;
                    tableBody.appendChild(row);
                });
            })
            .catch(error => console.error('Error fetching reports:', error));
    </script>
</body>

</html>
