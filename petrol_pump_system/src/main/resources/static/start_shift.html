<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Start Shift - GTL Petrol Pump</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
        body {
            font-family: Arial, sans-serif;
        }

        .navbar {
            background-color: #007bff;
        }

        .navbar-brand {
            color: white !important;
        }

        .form-container {
            padding: 40px;
            max-width: 800px;
            margin: 20px auto;
            background-color: #f8f9fa;
            border-radius: 8px;
            box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.1);
        }

        footer {
            text-align: center;
            margin-top: 30px;
            color: #6c757d;
        }

        h2 {
            font-size: 24px;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-control {
            border-radius: 8px;
        }

        .btn-primary {
            background-color: #007bff;
            border-color: #007bff;
            border-radius: 8px;
        }

        .btn-primary:hover {
            background-color: #0056b3;
            border-color: #0056b3;
        }

        .checkbox-group label {
            margin-right: 15px;
        }

        .checkbox-group input[type="checkbox"] {
            margin-right: 8px;
        }

        .dropdown-menu {
            max-height: 300px;
            overflow-y: auto;
        }

        .form-check {
            margin-bottom: 10px;
        }

        .nozzle-input-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nozzle-input-group input {
            flex: 1;
        }

        .nozzle-input-group span {
            width: 100px;
        }

        .status {
            color: green;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">GTL Petrol Pump</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="/contact.html">Contact Us</a></li>
                    <li class="nav-item"><a class="nav-link" href="/login.html">Login</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Start Shift Form -->
    <div class="form-container">
        <h2>Start Shift - Nozzle Details</h2>
        <form action="/process_shift" method="POST">

            <!-- Previous Data (Start Reading & Prices) -->
            <input type="hidden" name="pricePerLiterPetrol" value="{{pricePerLiterPetrol}}">
            <input type="hidden" name="pricePerLiterDiesel" value="{{pricePerLiterDiesel}}">

            <!-- Nozzle Details for Selected Machines -->
            <div class="form-group" id="nozzleGroup">
                <label>Select Nozzles</label>
                <div id="nozzleOptions"></div>
            </div>

            <div class="status">Shift Status: <span id="shiftStatus">Shift is Running</span></div>

            <button type="submit" class="btn btn-primary">Complete Shift</button>
        </form>
    </div>

    <footer>
        <p>&copy; 2025 GTL Petrol Pump | All Rights Reserved</p>
    </footer>

    <!-- Script for Dynamic Nozzle Dropdown and Start Reading, Difference Calculation -->
    <script>
        // Sample Data (you should replace this with actual data from previous page)
        const startReadings = {
            "M1N1": 1000.50, // Machine 1, Nozzle 1
            "M1N2": 1200.30, // Machine 1, Nozzle 2
            "M2N1": 1500.75, // Machine 2, Nozzle 1
            "M2N2": 1750.60, // Machine 2, Nozzle 2
            // Add more start readings here...
        };

        // Example price per liter (from the previous page)
        const pricePerLiterPetrol = 120.50;  // Example price for petrol
        const pricePerLiterDiesel = 110.25;  // Example price for diesel

        // Selected machines from previous page (this should be dynamically passed from the session)
        const selectedMachines = ["Machine 1", "Machine 2"];  // Sample machines, should be dynamic based on previous page

        document.addEventListener('DOMContentLoaded', function () {
            const nozzleGroup = document.getElementById("nozzleGroup");
            const nozzleOptions = document.getElementById("nozzleOptions");

            // Clear previous nozzle options
            nozzleOptions.innerHTML = "";

            // Only show the nozzle selection if at least one machine is selected
            if (selectedMachines.length > 0) {

                let nozzleCount = 0;

                // Loop through selected machines
                selectedMachines.forEach((machine, machineIndex) => {
                    for (let nozzleIndex = 1; nozzleIndex <= 2; nozzleIndex++) {  // Assuming 2 nozzles per machine
                        nozzleCount++;
                        const nozzleName = `M${machineIndex + 1}N${nozzleIndex}`;

                        const div = document.createElement("div");
                        div.classList.add("form-check", "nozzle-input-group");

                        const label = document.createElement("label");
                        label.innerText = nozzleName;
                        label.style.width = "100px";

                        const currentReadingInput = document.createElement("input");
                        currentReadingInput.type = "number";
                        currentReadingInput.step = "0.01";
                        currentReadingInput.name = `startReading[${nozzleName}]`;
                        currentReadingInput.value = startReadings[nozzleName] || 0;
                        currentReadingInput.classList.add("form-control");
                        currentReadingInput.placeholder = "Start Reading";
                        currentReadingInput.readOnly = true;

                        const endReadingInput = document.createElement("input");
                        endReadingInput.type = "number";
                        endReadingInput.step = "0.01";
                        endReadingInput.name = `endReading[${nozzleName}]`;
                        endReadingInput.classList.add("form-control");
                        endReadingInput.placeholder = "End Reading";

                        const differenceInput = document.createElement("input");
                        differenceInput.type = "number";
                        differenceInput.step = "0.01";
                        differenceInput.name = `differenceReading[${nozzleName}]`;
                        differenceInput.classList.add("form-control");
                        differenceInput.readOnly = true;
                        differenceInput.placeholder = "Difference";

                        // Calculate the difference based on the end reading and price
                        endReadingInput.addEventListener('input', function () {
                            const startReading = parseFloat(currentReadingInput.value) || 0;
                            const endReading = parseFloat(endReadingInput.value) || 0;
                            const difference = (endReading - startReading).toFixed(2);
                            differenceInput.value = difference;

                            // Calculate the cost based on the fuel type (Petrol or Diesel)
                            let fuelCost = 0;
                            if (difference > 0) {
                                fuelCost = difference * pricePerLiterPetrol;  // Use appropriate price for petrol/diesel
                            }

                            // Optionally display the fuel cost somewhere on the page
                            console.log(`Fuel Cost for ${nozzleName}: Rs. ${fuelCost.toFixed(2)}`);
                        });

                        div.appendChild(label);
                        div.appendChild(currentReadingInput);
                        div.appendChild(endReadingInput);
                        div.appendChild(differenceInput);

                        nozzleOptions.appendChild(div);
                    }
                });
            }
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
