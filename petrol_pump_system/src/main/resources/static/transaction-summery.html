<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transaction Summary - GTL Petrol Pump</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
        body {
            font-family: Arial, sans-serif;
        }

        .form-container {
            padding: 40px;
            max-width: 800px;
            margin: 40px auto;
            background-color: #f8f9fa;
            border-radius: 8px;
            box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.1);
        }

        .btn-primary {
            background-color: #007bff;
            border-color: #007bff;
        }

        .btn-primary:hover {
            background-color: #0056b3;
        }

        .btn-danger {
            background-color: #dc3545;
            border-color: #dc3545;
        }

        .btn-danger:hover {
            background-color: #b02a37;
        }

        .summary {
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div class="form-container">
        <h2>Transaction Summary</h2>
        <form id="transactionForm">
            <div class="mb-3">
                <label for="upiAmount" class="form-label">UPI Amount</label>
                <input type="number" id="upiAmount" class="form-control" placeholder="Enter UPI amount" required>
            </div>
            <div class="mb-3">
                <label for="cashAmount" class="form-label">Cash Amount</label>
                <input type="number" id="cashAmount" class="form-control" placeholder="Enter Cash amount" required>
            </div>
            <div class="mb-3">
                <label for="cardAmount" class="form-label">Card Amount</label>
                <input type="number" id="cardAmount" class="form-control" placeholder="Enter Card amount" required>
            </div>
            <div class="mb-3">
                <label for="creditAmount" class="form-label">Credit Amount</label>
                <input type="number" id="creditAmount" class="form-control" placeholder="Enter Credit amount" required>
            </div>
            <button type="button" class="btn btn-primary" onclick="calculateTotal()">Calculate Total</button>
            <div class="summary" id="totalSummary"></div>
        </form>

        <button class="btn btn-danger mt-4" onclick="endShift()">End Shift</button>
        <div id="endMessage" class="mt-3" style="display: none; color: green; font-weight: bold;">Shift is ended.</div>
    </div>

    <script>
    function calculateTotal() {
        const upi = parseFloat(document.getElementById("upiAmount").value) || 0;
        const cash = parseFloat(document.getElementById("cashAmount").value) || 0;
        const card = parseFloat(document.getElementById("cardAmount").value) || 0;
        const credit = parseFloat(document.getElementById("creditAmount").value) || 0;

        const total = upi + cash + card + credit;
        document.getElementById("totalSummary").innerText = `Total Amount: ₹${total.toFixed(2)}`;
    }

    function endShift() {
        window.location.href = "shift-end.html";
    }
</script>

</body>

</html>
